<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rialo Racing: The Finality Lap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <h1>Rialo Racing: The Finality Lap 🏎️</h1>
        <p>Choose the optimal Rialo feature to win the race or manage your car NFT!</p>
        
        <div id="stats">
            <p>Score: <span id="score">0</span> / 100</p>
            <p>Race Time: <span id="timer">45</span>s</p>
        </div>

        <div id="question-box">
            <h2 id="question"></h2>
            <div id="choices" class="choices-grid">
                </div>
        </div>

        <button id="start-button">START THE RACE</button>
        <div id="message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
